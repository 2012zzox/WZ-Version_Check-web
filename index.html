
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>It works!</title>
    <style>
      body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      h1 {
        animation-name: rainbow;
        animation-duration: 5s;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
      }
      h1, p {
        margin: 0.8rem 0;
      }
      @keyframes rainbow {
        0% { color: #ff0000; }
        17% { color: #ffff00; }
        33% { color: #00ff00; }
        50% { color: #00ffff; }
        67% { color: #0000ff; }
        83% { color: #ff00ff; }
        100% { color: #ff0000; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>It works!</h1>
      <input type="text" class="input" value="0.1.2"> <button class="send">Send!</button>
      <p class="received"></p>
    </main>
    <script>
      let clicks = 0;
      document.querySelector(".clickme").addEventListener("click", (e) => {
        clicks++;
        e.target.textContent = `Clicks: ${clicks}`;
      });

      window.addEventListener('load', () => {
        setTimeout(() => {
          const message = document.querySelector(".input").value;
          window.parent.postMessage(message, "*");
          console.log("Auto-sent message:", message);
        }, 1000); 
      });

      document.querySelector(".send").addEventListener("click", (e) => {
        console.log("Click disabled for sending.");
      });

      window.addEventListener("message", (e) => {
        if (e.source === window.parent && e.data !== undefined) {
           document.querySelector(".received").textContent = "Last message received by iframe: " + e.data;
        }
      });
    </script>
  </body>
</html>
